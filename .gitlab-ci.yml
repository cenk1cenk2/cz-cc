---
stages:
  - install
  - build
  - publish

variables:
  NODE_VERSION: 24-alpine
  NODE_PACKAGE_MANAGER: pnpm

include:
  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml
  - project: devops/pipelines
    ref: node@2.1.1
    file:
      - /node/install.gitlab-ci.yml
      - /node/build.gitlab-ci.yml
      - /node/lint.gitlab-ci.yml
      - /node/run.gitlab-ci.yml

  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml

install:
  stage: install
  extends:
    - .node-install
lint:
  stage: build
  extends:
    - .node-lint
typecheck:
  stage: build
  extends: .node-run
  variables:
    NODE_COMMAND_SCRIPT: typecheck
build:
  stage: build
  extends:
    - .node-build
  needs:
    - install
  dependencies:
    - install
semantic-release:
  stage: publish
  extends:
    - .semantic-release
  needs:
    - build
    - lint
    - typecheck
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(master|main|alpha|beta|rc|next)$/'
      interruptible: true
    - when: never
